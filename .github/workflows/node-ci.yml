name: Reusable — Node / Bun CI

# Called by other repos via `uses:`. Does not run on its own.
# See rust-ci.yml for how the `runner` input works and why `commands` is a list.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          runs-on value, as JSON. Defaults to a GitHub-hosted runner: a
          self-hosted one is registered to specific repos, and a job whose
          labels match nothing queues forever rather than falling back.
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        type: string
        default: '.'
      node-version:
        description: 'Node to install. Empty skips setup-node entirely — for a Bun-only repo.'
        type: string
        default: '20'
      bun-version:
        description: 'Bun to install when `bun` is true. Pin it if the repo pins it.'
        type: string
        default: 'latest'
      node-cache:
        description: "setup-node dependency cache: npm | yarn | pnpm. Empty disables it."
        type: string
        default: ''
      env:
        description: >-
          Extra environment for the commands, one KEY=VALUE per line. Build steps
          routinely need configuration (API URLs, public keys) that is not secret
          but is required, and without this such a repo cannot use this workflow
          at all. Do NOT put secrets here — inputs are visible in the run log.
        type: string
        default: ''
      bun:
        description: >-
          Install Bun BEFORE the install step. Before, not after, because a
          Bun-based repo installs its dependencies with `bun install`, and
          repos that only need Bun to run tests are unharmed by having it early.
        type: boolean
        default: false
      install-cmd:
        description: 'Dependency install. Empty skips it.'
        type: string
        default: 'npm install'
      artifact-name:
        description: 'Artifact name. Upload is skipped unless artifact-path is set too.'
        type: string
        default: ''
      artifact-path:
        description: 'Path(s) to upload. Empty disables the upload step entirely.'
        type: string
        default: ''
      artifact-when:
        description: >-
          When to upload: failure | always | success. Defaults to failure,
          because the common case is a report you only want when something
          broke — uploading on every green run costs storage against the same
          quota GHCR images draw on.
        type: string
        default: 'failure'
      artifact-retention-days:
        description: 'Days to keep it. 0 uses the repository default.'
        type: number
        default: 0
      commands:
        description: >-
          Commands to run after install, one per line, in order. A list rather
          than a fixed lint/typecheck/test triple: repos disagree on how many
          steps they have and what they are called, and the part that actually
          repeats is the setup above, not these.
        type: string
        default: ''

jobs:
  node:
    runs-on: ${{ fromJSON(inputs.runner) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}

      - uses: oven-sh/setup-bun@v2
        if: inputs.bun
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        if: inputs.install-cmd != ''
        run: ${{ inputs.install-cmd }}

      - name: Run
        if: inputs.commands != ''
        shell: bash
        run: |
          set -uo pipefail
          # Apply the caller's env before anything runs, so every command sees it.
          while IFS= read -r kv; do
            [ -z "${kv// }" ] && continue
            export "$kv"
          done <<'ENVVARS'
          ${{ inputs.env }}
          ENVVARS
          status=0
          while IFS= read -r cmd; do
            [ -z "${cmd// }" ] && continue
            case "$cmd" in \#*) continue ;; esac
            echo "::group::$cmd"
            if ! bash -c "$cmd"; then
              echo "::error::failed: $cmd"
              status=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done <<'COMMANDS'
          ${{ inputs.commands }}
          COMMANDS
          exit $status

      # `always()` appears in the expression on purpose: supplying an `if:`
      # without a status function leaves the implicit success() ANDed on, which
      # would skip the upload after a failing step - the exact case a report is
      # wanted for.
      - name: Upload artifact
        if: >-
          ${{ inputs.artifact-path != '' && (
                (inputs.artifact-when == 'always'  && always())  ||
                (inputs.artifact-when == 'failure' && failure()) ||
                (inputs.artifact-when == 'success' && success())
              ) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
