name: Reusable — Rust CI

# Called by other repos via `uses:`. Does not run on its own.
#
# The `runner` default below is the single place the whole fleet's runner target
# is decided. Callers omit the input and inherit it; pass it explicitly only to
# opt a repo out. To move everything back to GitHub-hosted, change this one
# default and move the version tag (see README).
#
#   self-hosted : '["self-hosted","macOS","ARM64"]'
#   github      : '"ubuntu-latest"'

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          runs-on value, as JSON — either a string or an array. Defaults to a
          GitHub-hosted runner because that is the only target every consumer
          has. A self-hosted runner is registered to specific repos, so a
          self-hosted DEFAULT means any repo without one queues forever: GitHub
          does not fall back to hosted when no runner matches the labels, it
          just waits. Repos that have one opt in explicitly.
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: 'directory the cargo commands run in'
        type: string
        default: '.'
      cache-workspaces:
        description: 'Swatinem/rust-cache workspaces path'
        type: string
        default: '.'
      toolchain:
        description: 'rustup toolchain, e.g. "stable" or an MSRV pin like "1.88.0"'
        type: string
        default: 'stable'
      components:
        description: 'extra rustup components, e.g. "clippy, rustfmt"'
        type: string
        default: ''
      commands:
        description: >-
          Commands to run after setup, one per line, in order. This is a list
          rather than a boolean per command because that is where the previous
          design broke: a repo needing `cargo clippy` twice with different
          feature sets could not express it, and adding clippy2/clippy3 inputs
          turns a workflow into an unreadable config language. What repeats
          across repos is the SETUP - checkout, toolchain, cache - not which
          cargo invocations follow it.
          Each line is echoed as a collapsible log group so a failure is still
          attributable to one command.
        type: string
        default: |
          cargo fmt --all --check
          cargo clippy --workspace --all-features -- -D warnings
          cargo test --workspace --all-features

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ fromJSON(inputs.runner) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # @master, not @stable: the ref IS the toolchain for that action, so a
      # pinned MSRV can only be passed when the ref accepts a toolchain input.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: ${{ inputs.components }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.cache-workspaces }}

      - name: Run
        shell: bash
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r cmd; do
            [ -z "${cmd// }" ] && continue
            case "$cmd" in \#*) continue ;; esac
            echo "::group::$cmd"
            if ! bash -c "$cmd"; then
              echo "::error::failed: $cmd"
              status=1
              echo "::endgroup::"
              # Stop at the first failure. Later commands usually depend on
              # earlier ones, and a wall of cascading errors buries the cause.
              break
            fi
            echo "::endgroup::"
          done <<'COMMANDS'
          ${{ inputs.commands }}
          COMMANDS
          exit $status
